<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Floating Staircase Model</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Three.js and OrbitControls CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- UI Overlay -->
  <div class="ui-panel">
    <h2>3D Model Presentation</h2>
    <h3>Modern Floating Staircase</h3>
    <p><strong>Task 3:</strong> Civil / Architectural Structure</p>
    <ul>
      <li><strong>Treads:</strong> Polished Concrete</li>
      <li><strong>Spine:</strong> Brushed Steel Stringer</li>
      <li><strong>Railing:</strong> Tempered Glass & Standoff Pins</li>
    </ul>
    <div class="controls-hint">
      <p>🖱️ <strong>Rotate:</strong> Left Click + Drag</p>
      <p>🔍 <strong>Zoom:</strong> Scroll Wheel</p>
      <p>✋ <strong>Pan:</strong> Right Click + Drag</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
