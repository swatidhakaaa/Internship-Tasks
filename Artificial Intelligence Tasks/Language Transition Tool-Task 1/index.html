<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Language Translation Tool</title>
  
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <header class="app-header">
      <h1><i class="fa-solid fa-language"></i> Translation Tool</h1>
      <p>Translate text quickly across multiple languages with text-to-speech and copy support.</p>
    </header>

    <!-- Language Selector Controls -->
    <div class="controls">
      <div class="select-group">
        <label for="source-lang">From</label>
        <select id="source-lang">
          <option value="autodetect">Auto Detect</option>
          <option value="en" selected>English</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="it">Italian</option>
          <option value="pt">Portuguese</option>
          <option value="hi">Hindi</option>
          <option value="zh">Chinese</option>
          <option value="ja">Japanese</option>
          <option value="ar">Arabic</option>
          <option value="ru">Russian</option>
        </select>
      </div>

      <button id="swap-btn" class="icon-btn" title="Swap Languages">
        <i class="fa-solid fa-arrow-right-arrow-left"></i>
      </button>

      <div class="select-group">
        <label for="target-lang">To</label>
        <select id="target-lang">
          <option value="es" selected>Spanish</option>
          <option value="en">English</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="it">Italian</option>
          <option value="pt">Portuguese</option>
          <option value="hi">Hindi</option>
          <option value="zh">Chinese</option>
          <option value="ja">Japanese</option>
          <option value="ar">Arabic</option>
          <option value="ru">Russian</option>
        </select>
      </div>
    </div>

    <!-- Translation Panels -->
    <div class="translation-wrapper">
      <!-- Input Panel -->
      <div class="panel">
        <div class="panel-header">
          <span>Source Text</span>
          <span id="char-count">0 / 1000</span>
        </div>
        <textarea id="source-text" maxlength="1000" placeholder="Type or paste text to translate..."></textarea>
        <div class="panel-actions">
          <button id="mic-btn" class="action-btn" title="Speech Input">
            <i class="fa-solid fa-microphone"></i> Listen
          </button>
          <button id="clear-btn" class="action-btn" title="Clear Input">
            <i class="fa-solid fa-trash"></i> Clear
          </button>
        </div>
      </div>

      <!-- Output Panel -->
      <div class="panel">
        <div class="panel-header">
          <span>Translation</span>
          <span id="status-tag" class="status-tag">Ready</span>
        </div>
        <div class="output-container">
          <textarea id="target-text" readonly placeholder="Translation will appear here..."></textarea>
          <div id="loader" class="loader hidden"></div>
        </div>
        <div class="panel-actions">
          <button id="speak-btn" class="action-btn" title="Text to Speech">
            <i class="fa-solid fa-volume-high"></i> Listen
          </button>
          <button id="copy-btn" class="action-btn" title="Copy to Clipboard">
            <i class="fa-regular fa-copy"></i> Copy
          </button>
        </div>
      </div>
    </div>

    <!-- Submit Button -->
    <button id="translate-btn" class="translate-btn">
      <i class="fa-solid fa-wand-magic-sparkles"></i> Translate
    </button>
  </div>

  <!-- Notification Toast -->
  <div id="toast" class="toast hidden">Copied to clipboard!</div>

  <!-- JavaScript -->
  <script src="script.js"></script>
</body>
</html>
